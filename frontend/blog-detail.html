    <style>
        * {
            box-sizing: border-box;
        }

        html {

        }

        body {
            font-family: 'Manrope', sans-serif;

        }

        .font-sport {

        }

        .vintage-header {
            background: linear-gradient(135deg, rgba(13, 19, 27, .97) 0%, rgba(26, 34, 45, .94) 58%, rgba(44, 18, 24, .92) 100%);

        }

        .vintage-link {
            color: #e8edf4;
        }

        .vintage-link:hover {
            color: #fff;
        }

        /* Hero area */
        .article-hero {
            position: relative;
            height: 420px;
            overflow: hidden;
        }

        .article-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .6s ease;
        }

        .article-hero:hover img {
            transform: scale(1.03);
        }

        .article-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, .85) 0%, rgba(0, 0, 0, .25) 55%, transparent 100%);
        }

        .article-hero-text {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px;
        }

        /* Content */
        .article-body p {
            font-size: 16px;
            line-height: 1.9;
            color: #374151;
            margin-bottom: 20px;
        }

        .article-body p:first-child::first-letter {
            font-family: 'Playfair Display', serif;
            font-size: 58px;
            font-weight: 800;
            color: #9b111e;
            float: left;
            line-height: .8;
            margin-right: 10px;
            margin-top: 6px;
        }

        .article-body blockquote {
            border-left: 4px solid #9b111e;
            background: #fff5f5;
            padding: 16px 20px;
            border-radius: 0 12px 12px 0;
            font-style: italic;
            color: #6b1d28;
            margin: 24px 0;
        }

        /* Related card */
        .rel-card {
            background: #fff;
            border-radius: 14px;
            border: 1.5px solid #f3f4f6;
            overflow: hidden;
            transition: border-color .2s, box-shadow .2s;
        }

        .rel-card:hover {
            border-color: #9b111e;
            box-shadow: 0 6px 20px rgba(155, 17, 30, .1);
        }

        .rel-card img {
            transition: transform .5s;
        }

        .rel-card:hover img {
            transform: scale(1.07);
        }

        /* Share buttons */
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            transition: all .2s;
        }

        /* ═══════════════════════════════════════════════════
           RENDER ARTICLE
        ═══════════════════════════════════════════════════ */
        function getQueryParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        const articleKey = getQueryParam('article') || 'hero';
        const article = blogArticles[articleKey] || blogArticles.hero;

        // Update page title
        document.getElementById('page-title').textContent = article.title + ' | AnhTu Store';

        // Set image
        const imgEl = document.getElementById('article-image');
        imgEl.src = article.image;
        imgEl.alt = article.title;
        // Fallback if image fails
        imgEl.onerror = function () { this.src = 'image/anhvodich/anh2.jpg'; };

        // Set meta
        document.getElementById('article-category').textContent = article.category;
        document.getElementById('article-title').textContent = article.title;
        document.getElementById('article-date').textContent = article.date;
        document.getElementById('article-readtime').textContent = article.readTime;

        // Set content (support raw HTML for blockquotes)
        document.getElementById('article-content').innerHTML = article.content
            .map(p => p.startsWith('<blockquote') ? p : `<p>${p}</p>`)
            .join('');

        /* ═══════════════════════════════════════════════════
           RENDER RELATED ARTICLES
        ═══════════════════════════════════════════════════ */
        const related = document.getElementById('related-articles');
        const relEntries = Object.entries(blogArticles).filter(([k]) => k !== articleKey);

        relEntries.forEach(([key, item]) => {
            const a = document.createElement('a');
            a.href = `blog-detail.html?article=${key}`;
            a.className = 'rel-card block flex gap-3 p-3';
            a.innerHTML = `
        <div class="w-16 h-16 rounded-xl overflow-hidden flex-shrink-0">
            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover"
                 onerror="this.src='image/anhvodich/anh2.jpg'">
        </div>
        <div class="flex-grow min-w-0">
            <p class="text-[9px] uppercase tracking-widest text-gray-400 font-bold mb-1">${item.category}</p>
            <h4 class="font-sport text-sm font-bold leading-snug line-clamp-2 hover:text-[#9b111e] transition">${item.title}</h4>
            <p class="text-[10px] text-gray-400 mt-1">${item.date}</p>
        </div>`;
            related.appendChild(a);
        });
    </script>
