<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu thích | AnhTu Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
    <style>
        body { font-family: 'Manrope', sans-serif; background: #f7f8fa; }
        .font-brand { font-family: 'Playfair Display', serif; letter-spacing: 0.03em; }
        .vintage-header {
            background: linear-gradient(135deg, rgba(13, 19, 27, 0.95) 0%, rgba(26, 34, 45, 0.92) 58%, rgba(44, 18, 24, 0.9) 100%);
            border-bottom: 1px solid rgba(152, 53, 68, 0.45);
        }
    </style>
</head>
<body class="min-h-screen">
    <header class="vintage-header text-white py-5 px-4 shadow-xl">
        <div class="container mx-auto flex items-center justify-between">
            <a href="index.html" class="font-brand text-4xl">ANHTU<span class="text-[#d7dde6]">STORE</span></a>
            <a href="index.html" class="text-sm uppercase tracking-[0.2em] text-[#e8edf4] hover:text-white transition">Về trang chủ</a>
        </div>
    </header>

    <main class="container mx-auto py-12 px-4">
        <div class="flex justify-between items-end mb-10 border-b border-gray-200 pb-4">
            <h1 class="font-brand text-4xl uppercase">Danh sách yêu thích</h1>
            <span id="favorite-count-text" class="text-sm text-gray-500 uppercase tracking-wider">0 sản phẩm</span>
        </div>

        <div id="favorites-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
            <p class="col-span-full text-center text-gray-500 py-16">Đang tải sản phẩm...</p>
        </div>
    </main>

    <script>
        const favoritesList = document.getElementById('favorites-list');
        const favoriteCountText = document.getElementById('favorite-count-text');
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];

        function updateCountText(total) {
            favoriteCountText.textContent = `${total} sản phẩm`;
        }

        function saveFavorites() {
            localStorage.setItem('favorites', JSON.stringify(favorites));
        }

        function renderFavoriteProducts(products) {
            if (favorites.length === 0) {
                updateCountText(0);
                favoritesList.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <p class="text-base text-gray-500 mb-3">Bạn chưa thêm sản phẩm nào vào mục yêu thích.</p>
                        <a href="index.html#product-list-section" class="inline-block bg-black text-white px-5 py-2.5 uppercase text-[11px] tracking-widest hover:bg-red-700 transition">Khám phá sản phẩm</a>
                    </div>
                `;
                return;
            }

            const favoriteProducts = products.filter((product) => favorites.includes(product._id));
            updateCountText(favoriteProducts.length);

            if (!favoriteProducts.length) {
                favorites = [];
                saveFavorites();
                renderFavoriteProducts(products);
                return;
            }

            favoritesList.innerHTML = favoriteProducts.map((product) => `
                <div class="bg-white border border-gray-100 shadow-sm hover:shadow-md transition p-1.5 rounded-sm flex flex-col justify-between h-full">
                    <div>
                        <a href="product.html?id=${product._id}" class="block bg-gray-100 aspect-[3/4] mb-2 overflow-hidden rounded-sm">
                            <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover hover:scale-105 transition duration-500">
                        </a>
                        <div class="px-1 pb-2">
                            <a href="product.html?id=${product._id}" class="block font-semibold text-xs md:text-sm mb-1 hover:text-red-700 line-clamp-2 h-8 md:h-10 leading-tight">${product.name}</a>
                            <p class="text-[10px] uppercase text-gray-400 mb-1">${product.category || 'Sản phẩm'}</p>
                            ${(() => {
                                const reviews = product.reviews || [];
                                const actualRatings = reviews.filter(r => (Number(r.rating) || 0) > 0);
                                const totalReviews = actualRatings.length;
                                const avgRating = totalReviews > 0 ? (actualRatings.reduce((sum, r) => sum + (Number(r.rating) || 0), 0) / totalReviews).toFixed(1) : 0;
                                const ratingPercent = (avgRating / 5) * 100;
                                if (totalReviews > 0) {
                                    return `
                                        <div class="flex flex-col gap-1 mb-2 mt-1">
                                            <div class="flex justify-between items-center text-[9px]">
                                                <span class="font-bold text-gray-700 flex items-center">${avgRating} <span class="text-yellow-400 text-[9px] ml-0.5 mb-0.5">★</span></span>
                                                <span class="text-gray-400 font-medium">(${totalReviews})</span>
                                            </div>
                                            <div class="w-full bg-gray-200 rounded-full h-1 shadow-inner">
                                                <div class="bg-gradient-to-r from-yellow-300 to-yellow-500 h-1 rounded-full" style="width: ${ratingPercent}%"></div>
                                            </div>
                                        </div>
                                    `;
                                }
                                return `<p class="text-[9px] text-gray-400 italic mb-2 mt-1">Chưa có đánh giá</p>`;
                            })()}
                        </div>
                    </div>
                    <div class="px-1 pb-1 flex items-center justify-between mt-auto pt-1 border-t border-gray-50">
                        <span class="font-bold text-xs md:text-sm text-gray-900">${product.price.toLocaleString('vi-VN')}₫</span>
                        <button onclick="removeFavorite('${product._id}')" class="text-[10px] uppercase tracking-wider text-rose-700 hover:text-rose-900 font-bold outline-none">Bỏ thích</button>
                    </div>
                </div>
            `).join('');
        }

        window.removeFavorite = function(productId) {
            favorites = favorites.filter((id) => id !== productId);
            saveFavorites();
            loadFavorites();
        };

        async function loadFavorites() {
            try {
                const response = await fetch('http://localhost:5000/api/products');
                if (!response.ok) throw new Error('Không tải được dữ liệu');
                const products = await response.json();
                renderFavoriteProducts(products);
            } catch (error) {
                favoritesList.innerHTML = '<p class="col-span-full text-center text-red-500 py-16">Không thể tải danh sách yêu thích. Hãy đảm bảo backend đang chạy.</p>';
            }
        }

        loadFavorites();

        // Kết nối WebSocket và fetch thông báo admin nếu là admin
        if (window.userInfo && window.userInfo.isAdmin) { // Sử dụng window.userInfo
            window.connectAdminWebSocket(); // Gọi hàm toàn cục từ script.js
            window.fetchAdminNotifications(); // Gọi hàm toàn cục từ script.js
        }
    </script>
</body>
</html>
