<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân | AnhTu Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <style> .font-sport { font-family: 'Oswald', sans-serif; } </style>
</head>
<body class="bg-gray-100 text-black antialiased">

    <header class="bg-black text-white p-6 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="font-sport text-3xl font-bold tracking-tighter">
                <a href="index.html">ARSENAL <span class="text-gray-500 font-normal">DIRECT</span></a>
            </h1>
            <a href="index.html" class="text-sm font-bold uppercase tracking-widest hover:text-red-500 transition">❮ Về trang chủ</a>
        </div>
    </header>

    <main class="container mx-auto py-12 px-4 max-w-6xl flex flex-col md:flex-row gap-8">
        
        <div class="md:w-1/3">
            <div class="bg-white p-8 shadow-sm border-t-4 border-black">
                <h2 class="font-sport text-2xl font-bold mb-6 uppercase border-b pb-2">Tài Khoản</h2>
                <div class="space-y-4">
                    <div>
                        <p class="text-xs text-gray-500 uppercase font-bold">Họ và tên</p>
                        <p id="profile-name" class="text-lg font-bold">---</p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 uppercase font-bold">Email</p>
                        <p id="profile-email" class="text-lg">---</p>
                    </div>
                    <button onclick="logout()" class="mt-6 w-full bg-red-700 text-white py-3 font-bold uppercase hover:bg-red-800 transition">
                        Đăng Xuất
                    </button>
                </div>
            </div>
        </div>

        <div class="md:w-2/3">
            <div class="bg-white p-8 shadow-sm border-t-4 border-red-700">
                <h2 class="font-sport text-2xl font-bold mb-6 uppercase border-b pb-2">Lịch sử đơn hàng</h2>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 uppercase text-xs text-gray-500">
                                <th class="p-3 border">Mã đơn</th>
                                <th class="p-3 border">Ngày đặt</th>
                                <th class="p-3 border">Tổng tiền</th>
                                <th class="p-3 border">Tình trạng</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table">
                            <tr><td colspan="4" class="p-4 text-center">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Kiểm tra đăng nhập
        const userInfo = JSON.parse(localStorage.getItem('userInfo'));
        if (!userInfo) {
            window.location.href = 'login.html';
        }

        // Điền thông tin User
        document.getElementById('profile-name').innerText = userInfo.name;
        document.getElementById('profile-email').innerText = userInfo.email;

        // Hàm Đăng xuất
        function logout() {
            localStorage.removeItem('userInfo');
            window.location.href = 'index.html';
        }

        // Lấy lịch sử đơn hàng từ Backend
        async function fetchMyOrders() {
            try {
                // Gọi tới API bằng ID của User đang đăng nhập
                const response = await fetch(`http://localhost:5000/api/orders/myorders/${userInfo._id}`);
                const orders = await response.json();
                
                const tableBody = document.getElementById('orders-table');
                
                if (orders.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500 italic">Bạn chưa có đơn hàng nào.</td></tr>`;
                    return;
                }

                // Vẽ các đơn hàng ra bảng
                tableBody.innerHTML = orders.map(order => {
                    const date = new Date(order.createdAt).toLocaleDateString('vi-VN');
                    const status = order.isDelivered ? '<span class="text-green-600 font-bold">Đã giao</span>' : '<span class="text-red-600 font-bold">Chờ xử lý</span>';
                    
                    return `
                        <tr class="hover:bg-gray-50">
                            <td class="p-3 border text-xs text-blue-600 font-mono">${order._id}</td>
                            <td class="p-3 border text-sm">${date}</td>
                            <td class="p-3 border font-bold">${order.totalPrice.toLocaleString('vi-VN')}₫</td>
                            <td class="p-3 border">${status}</td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                document.getElementById('orders-table').innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Lỗi không thể tải đơn hàng.</td></tr>`;
            }
        }

        // Chạy hàm khi mở trang
        fetchMyOrders();
    </script>
</body>
</html>
