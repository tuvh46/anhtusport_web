<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | AnhTu Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style> .font-sport { font-family: 'Oswald', sans-serif; } </style>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-red-800 text-white p-5 shadow-xl">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="font-sport text-2xl tracking-tighter uppercase">AnhTu Store <span class="font-normal opacity-50">| Quản trị</span></h1>
            <a href="index.html" class="text-sm font-bold border border-white px-4 py-2 hover:bg-white hover:text-red-800 transition">Quay lại Shop</a>
        </div>
    </nav>

    <main class="container mx-auto py-10 px-4">
        <div class="grid grid-cols-1 gap-10">
            
            <div class="bg-white p-8 shadow-md border-t-4 border-red-800">
                <h2 class="font-sport text-3xl mb-6 uppercase">Danh sách đơn hàng toàn hệ thống</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-200 text-xs uppercase font-bold text-gray-600">
                                <th class="p-4 border">ID Đơn</th>
                                <th class="p-4 border">Khách hàng</th>
                                <th class="p-4 border">Ngày đặt</th>
                                <th class="p-4 border">Tổng tiền</th>
                                <th class="p-4 border">Trạng thái</th>
                                <th class="p-4 border">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="admin-orders-table">
                            <tr><td colspan="6" class="p-10 text-center animate-pulse text-gray-400">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        const userInfo = JSON.parse(localStorage.getItem('userInfo'));
        
        // Kiểm tra quyền Admin, nếu không phải thì đuổi về trang chủ
        if (!userInfo || !userInfo.isAdmin) {
            alert("Bạn không có quyền truy cập trang này!");
            window.location.href = 'index.html';
        }

        // 1. Lấy tất cả đơn hàng
        async function fetchAllOrders() {
            try {
                const response = await fetch('http://localhost:5000/api/orders/all');
                const orders = await response.json();
                renderOrders(orders);
            } catch (error) {
                console.error("Lỗi:", error);
            }
        }

        function renderOrders(orders) {
            const tableBody = document.getElementById('admin-orders-table');
            if (orders.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-10 text-center">Chưa có đơn hàng nào.</td></tr>`;
                return;
            }

            tableBody.innerHTML = orders.map(order => {
                const date = new Date(order.createdAt).toLocaleDateString('vi-VN');
                const statusClass = order.isDelivered ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
                const statusText = order.isDelivered ? 'Đã giao' : 'Chờ xử lý';

                return `
                    <tr class="hover:bg-gray-50 transition border-b">
                        <td class="p-4 text-xs font-mono text-blue-600">${order._id}</td>
                        <td class="p-4">
                            <div class="font-bold">${order.shippingAddress.fullname}</div>
                            <div class="text-xs text-gray-500">${order.shippingAddress.phone}</div>
                        </td>
                        <td class="p-4 text-sm text-gray-600">${date}</td>
                        <td class="p-4 font-bold text-red-800">${order.totalPrice.toLocaleString('vi-VN')}₫</td>
                        <td class="p-4">
                            <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase ${statusClass}">${statusText}</span>
                        </td>
                        <td class="p-4">
                            ${!order.isDelivered ? `
                                <button onclick="markAsDelivered('${order._id}')" class="bg-black text-white text-[10px] px-3 py-1 hover:bg-green-700 transition font-bold uppercase">Xác nhận giao</button>
                            ` : '<span class="text-gray-400 text-[10px] italic">Hoàn tất</span>'}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 2. Hàm xác nhận giao hàng
        async function markAsDelivered(id) {
            if (confirm("Xác nhận đơn hàng này đã được giao thành công?")) {
                try {
                    const response = await fetch(`http://localhost:5000/api/orders/${id}/deliver`, { method: 'PUT' });
                    if (response.ok) {
                        fetchAllOrders(); // Tải lại bảng
                    }
                } catch (error) {
                    alert("Lỗi khi cập nhật!");
                }
            }
        }

        fetchAllOrders();
    </script>
</body>
</html>
